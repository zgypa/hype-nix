name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Evaluate through the real updater without selecting a newer release.
      # This catches updater/Nix incompatibilities even when Hype is current.
      - name: Check the locked updater
        run: |
          nix develop .#maintenance --command nix-update hype --flake --version=skip
          git diff --exit-code
      - name: Build and test
        run: nix flake check -L
