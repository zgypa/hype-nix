name: Update Hype

on:
  schedule:
    # Off the hour to avoid the busy :00 window for scheduled workflows.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hype
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: cachix/install-nix-action@v31
      - name: Check for a new stable release
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix run nixpkgs#nix-update -- hype --flake --use-github-releases
          if git diff --quiet -- package.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and test the updated package
        if: steps.update.outputs.changed == 'true'
        run: nix flake check
      - name: Commit and push the update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.nix
          git commit -m "Update Hype to $(nix eval --raw .#packages.x86_64-linux.hype.version)"
          git push origin HEAD:main
